<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面错误</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4><i class="bi bi-exclamation-triangle"></i> 页面错误</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-danger" role="alert">
                            <h5>出现错误了！</h5>
                            <p>状态码: <strong th:text="${statusCode}">500</strong></p>
                            <p>错误信息: <strong th:text="${errorMessage}">未知错误</strong></p>
                        </div>

                        <h6>可能的解决方案：</h6>
                        <ul>
                            <li>检查URL是否正确</li>
                            <li>确保服务器正在运行</li>
                            <li>尝试刷新页面</li>
                            <li>如果问题持续，请联系管理员</li>
                        </ul>

                        <div class="mt-3">
                            <a href="/" class="btn btn-primary">
                                <i class="bi bi-house"></i> 返回主页
                            </a>
                            <a href="/test" class="btn btn-info">
                                <i class="bi bi-gear"></i> 测试页面
                            </a>
                            <button class="btn btn-secondary" onclick="window.history.back()">
                                <i class="bi bi-arrow-left"></i> 返回上页
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
