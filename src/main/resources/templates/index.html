<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钱包管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .account-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .account-header {
            background-color: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            cursor: pointer;
        }
        .account-body {
            padding: 15px;
        }
        .address-item {
            background-color: #fff;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .copy-btn {
            font-size: 12px;
            padding: 2px 8px;
        }
        .loading {
            display: none;
        }
        .coin-section {
            margin-bottom: 15px;
        }
        .coin-title {
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">钱包管理系统</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/">账号管理</a>
                <a class="nav-link" href="/vanity">靓号生成</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>账号管理</h2>
                    <div>
                        <button class="btn btn-success me-2" onclick="createAccount('mnemonic')">
                            <i class="bi bi-plus-circle"></i> 生成助记词账号
                        </button>
                        <button class="btn btn-info" onclick="createAccount('privatekey')">
                            <i class="bi bi-key"></i> 生成私钥账号
                        </button>
                    </div>
                </div>

                <!-- 加载状态 -->
                <div id="loading" class="loading text-center">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>正在加载...</p>
                </div>

                <!-- 账号列表 -->
                <div id="accountList">
                    <!-- 账号列表将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 账号创建成功模态框 -->
    <div class="modal fade" id="accountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">账号创建成功</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-warning">
                        <strong>重要提示：</strong>请务必保存以下信息，关闭窗口后将无法再次查看！
                    </div>
                    <div id="accountInfo">
                        <!-- 账号信息将在这里显示 -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">我已保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面加载时获取账号列表
        document.addEventListener('DOMContentLoaded', function() {
            loadAccounts();
        });

        // 加载账号列表
        async function loadAccounts() {
            const loading = document.getElementById('loading');
            const accountList = document.getElementById('accountList');

            loading.style.display = 'block';
            accountList.innerHTML = '';

            try {
                const response = await fetch('/api/accounts');
                const result = await response.json();

                if (result.success) {
                    renderAccounts(result.data);
                } else {
                    showError('获取账号列表失败: ' + result.message);
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        // 渲染账号列表
        function renderAccounts(accounts) {
            const accountList = document.getElementById('accountList');

            if (accounts.length === 0) {
                accountList.innerHTML = '<div class="alert alert-info">暂无账号，请创建一个新账号</div>';
                return;
            }

            let html = '';
            accounts.forEach((account, index) => {
                const collapseId = `collapse-${index}`;
                html += `
                    <div class="account-card">
                        <div class="account-header" data-bs-toggle="collapse" data-bs-target="#${collapseId}">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">
                                    <i class="bi bi-wallet2"></i> ${account.account_name}
                                </h5>
                                <i class="bi bi-chevron-down"></i>
                            </div>
                        </div>
                        <div class="collapse" id="${collapseId}">
                            <div class="account-body">
                                ${renderAddresses(account.addresses)}
                            </div>
                        </div>
                    </div>
                `;
            });

            accountList.innerHTML = html;
        }

        // 渲染地址列表
        function renderAddresses(addresses) {
            let html = '';

            for (const [coinType, addressList] of Object.entries(addresses)) {
                html += `
                    <div class="coin-section">
                        <div class="coin-title">
                            <i class="bi bi-currency-bitcoin"></i> ${coinType}
                        </div>
                `;

                addressList.forEach((address, index) => {
                    html += `
                        <div class="address-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <code class="flex-grow-1 me-2">${address}</code>
                                <button class="btn btn-outline-primary copy-btn" onclick="copyToClipboard('${address}')">
                                    <i class="bi bi-clipboard"></i> 复制
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
            }

            return html || '<div class="text-muted">暂无地址</div>';
        }

        // 创建账号
        async function createAccount(type) {
            const endpoint = type === 'mnemonic' ? '/api/accounts/create-mnemonic' : '/api/accounts/create-privatekey';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (result.success) {
                    showAccountInfo(result.data);
                    // 延迟刷新账号列表
                    setTimeout(() => {
                        loadAccounts();
                    }, 1000);
                } else {
                    showError('创建账号失败: ' + result.message);
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            }
        }

        // 显示账号信息
        function showAccountInfo(accountData) {
            const accountInfo = document.getElementById('accountInfo');
            let html = `
                <div class="mb-3">
                    <label class="form-label"><strong>账号ID:</strong></label>
                    <div class="input-group">
                        <input type="text" class="form-control" value="${accountData.accountId}" readonly>
                        <button class="btn btn-outline-primary" onclick="copyToClipboard('${accountData.accountId}')">复制</button>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>账号名称:</strong></label>
                    <input type="text" class="form-control" value="${accountData.accountName}" readonly>
                </div>
            `;

            if (accountData.mnemonic) {
                html += `
                    <div class="mb-3">
                        <label class="form-label"><strong>助记词:</strong></label>
                        <div class="input-group">
                            <textarea class="form-control" rows="3" readonly>${accountData.mnemonic}</textarea>
                            <button class="btn btn-outline-primary" onclick="copyToClipboard('${accountData.mnemonic}')">复制</button>
                        </div>
                    </div>
                `;
            }

            if (accountData.privateKey) {
                html += `
                    <div class="mb-3">
                        <label class="form-label"><strong>私钥:</strong></label>
                        <div class="input-group">
                            <input type="text" class="form-control" value="${accountData.privateKey}" readonly>
                            <button class="btn btn-outline-primary" onclick="copyToClipboard('${accountData.privateKey}')">复制</button>
                        </div>
                    </div>
                `;
            }

            accountInfo.innerHTML = html;

            const modal = new bootstrap.Modal(document.getElementById('accountModal'));
            modal.show();
        }

        // 复制到剪贴板
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showSuccess('已复制到剪贴板');
            } catch (error) {
                // 兜底方案
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showSuccess('已复制到剪贴板');
            }
        }

        // 显示成功消息
        function showSuccess(message) {
            const toast = createToast('success', message);
            document.body.appendChild(toast);
        }

        // 显示错误消息
        function showError(message) {
            const toast = createToast('danger', message);
            document.body.appendChild(toast);
        }

        // 创建Toast通知
        function createToast(type, message) {
            const toastHtml = `
                <div class="toast align-items-center text-white bg-${type} border-0" role="alert" style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
                    <div class="d-flex">
                        <div class="toast-body">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;

            const toastElement = document.createElement('div');
            toastElement.innerHTML = toastHtml;
            const toast = toastElement.firstElementChild;

            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();

            // 3秒后自动移除
            setTimeout(() => {
                if (document.body.contains(toast)) {
                    document.body.removeChild(toast);
                }
            }, 3000);

            return toast;
        }
    </script>
</body>
</html>
